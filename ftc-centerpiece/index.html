/* Single light theme on purpose: Happy Productions site is light cream. Layout: Happy Productions site language - cream paper, ink type, flat purple + yellow blocks. One long director's sheet: brief, then the second-by-second table, then the client file. */
:root{
  --paper:#fffdf6; --card:#ffffff; --cream:#f6f5ef; --ink:#1f1f1f; --muted:#5d5a66; --line:#e6e1d6;
  --purple:#7e66e0; --purple-ink:#5b45c4; --lav:#ebe7ff; --lav-strong:#cbc4fe; --yellow:#ffe757; --pink:#fdd0f7;
  --good:#1f8a4c; --warn:#b26a00; --bad:#c23a3a; --good-bg:#e3f5ea; --warn-bg:#fff1d6; --bad-bg:#fde4e4;
  --head-bg:#1f1f1f; --head-fg:#fffdf6;
  --display:"Cabinet Grotesk","Poppins",system-ui,sans-serif; --body:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;margin:0}
a{color:var(--purple-ink);text-underline-offset:2px}
a:focus-visible,button:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px}
h1,h2,h3{font-family:var(--display);font-weight:800;text-wrap:balance;letter-spacing:-.01em;margin:0}
h2{font-size:clamp(24px,3vw,32px);line-height:1.15}
h3{font-size:18px;font-weight:700}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
p{margin:0}
/* masthead */
.mast{background:var(--cream);border-bottom:1px solid var(--line)}
.mast .wrap{padding-block:22px 28px;display:grid;gap:18px}
.logo{height:26px;width:auto}
.logo-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.title-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end}
.mast h1{font-size:clamp(34px,5.4vw,64px);line-height:1}
.mast h1 .q{color:var(--purple)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;white-space:nowrap}
.chip b{font-weight:600}
.chip.due{background:var(--yellow);border-color:transparent;color:#1f1f1f}
.status{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
.st-warn{background:var(--warn-bg);color:var(--warn)}
.st-bad{background:var(--bad-bg);color:var(--bad)}
.st-good{background:var(--good-bg);color:var(--good)}
/* nav */
nav.jump{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
nav.jump .wrap{display:flex;gap:4px;overflow-x:auto;padding-block:8px}
nav.jump a{font-size:13px;font-weight:600;text-decoration:none;color:var(--ink);padding:6px 12px;border-radius:999px;white-space:nowrap}
nav.jump a:hover{background:var(--lav)}
section{scroll-margin-top:52px;padding-block:40px;border-bottom:1px solid var(--line)}
.sec-head{display:grid;gap:6px;margin-bottom:22px;max-width:760px}
.sec-head p{color:var(--muted)}
/* fold: Timeline, Motion graphics and Captions open with a dropdown (Atdhe 2026-10-23) */
details.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;padding:6px 0;border-radius:12px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary .fold-t{display:grid;gap:6px;min-width:0;flex:1}
details.fold>summary .fold-i{flex:none;width:36px;height:36px;border-radius:999px;border:1px solid var(--line);display:grid;place-items:center;font-size:16px;transition:transform .2s}
details.fold[open]>summary .fold-i{transform:rotate(180deg)}
details.fold>summary .fold-h{font-size:13px;color:var(--muted);font-weight:600}
details.fold[open]>summary .fold-h{display:none}
details.fold>summary:hover .fold-i,details.fold>summary:focus-visible .fold-i{background:var(--lav)}
details.fold>.fold-b{margin-top:16px}
/* brief */
.brief{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px}
.story{font-size:18px;line-height:1.55;max-width:62ch}
.story strong{background:linear-gradient(transparent 62%,var(--yellow) 62%);color:inherit}
.dodont{display:grid;gap:12px;align-content:start}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.box h3{margin-bottom:8px}
.box ul{margin:0;padding-left:18px;display:grid;gap:4px}
.box.do{border-top:4px solid var(--good)}
.box.dont{border-top:4px solid var(--bad)}
.feel{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.feel span{background:var(--lav);color:var(--ink);padding:6px 12px;border-radius:8px;font-weight:600;font-size:14px}
.changed{margin-top:24px;background:var(--lav);border-radius:14px;padding:18px 20px}
.changed h3{margin-bottom:8px}
.changed ol{margin:0;padding-left:20px;display:grid;gap:6px}
.keylinks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:28px}
.kl{display:grid;gap:4px;align-content:start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;text-decoration:none;color:var(--ink)}
a.kl:hover{border-color:var(--purple)}

        ? '<div class="rf-opt"><span class="hk">'+esc(g.text)+'</span><span class="note">Pays off on: <q>“'+esc(g.line)+'”</q></span><span class="src">'+esc(g.src)+'</span><span class="why">'+esc(g.why)+'</span><button type="button" class="btn" data-use="'+n+'">Use this hook</button></div>'
        : '<div class="rf-opt"><span class="who">'+esc(g.who)+'</span><q>“'+esc(g.quote)+'”</q><span class="src">'+esc(g.src)+'</span><span class="why">'+esc(g.why)+'</span><button type="button" class="btn" data-use="'+n+'">Use this bite</button></div>';
    }).join("");
    P.status.textContent=pages>1?("Options "+(stp[k]*4+1)+"–"+(stp[k]*4+show.length)+" of "+good.length+". Hit More for the next ones."):(good.length+(good.length===1?" option":" options")+" from this video's footage.");
    if(pages<2) P.more.disabled=true;
    P.list.querySelectorAll("[data-use]").forEach(function(b){ b.addEventListener("click",function(){ useOpt(i,kind,show[+b.getAttribute("data-use")]); }); });
  }
  async function run(i,kind){
    var sample=await getSample(); var P=panel(i,kind); if(!P) return;
    if(!sample){ return runStatic(i,kind,P); }
    var perms=await cap("permissions"), st=null;
    if(perms){ try{ st=await perms.state("sample"); }catch(x){ st=null; } }
    if(st==="denied"){ permOff(P,i,kind); P.more.disabled=false; return; }
    if(ctl[i]) ctl[i].abort(); ctl[i]=new AbortController();
    var k=kind+i; seen[k]=seen[k]||[]; var r=rows[i], sw=swaps[i]||{};
    P.more.disabled=true; P.status.textContent=kind==="hook"?"Reading the transcript for new hooks…":"Looking for new bites in the transcript…";
    var input;
    if(kind==="hook"){
      var cur=(sw.hook&&sw.hook.text)||hookText(r.motion);
      input=["You write on-screen HOOK TEXT for frame 1 (0:00) of a Happy Productions social video. A cold viewer sees it while scrolling. It is on screen at 0:00 and does not animate on.",
        "TASK: give 5 new hook text ideas. Make each one a different angle: a question, a surprising true detail, a tension, a promise, a 'you' line.",
        "HARD RULES:",
        "1. Max 9 words each.",
        "2. Every idea must come from something said in the TRANSCRIPT. Put that passage in \"line\", copied EXACTLY word for word: one continuous passage, 4 to 40 words, same words in the same order. You may drop only filler sounds (um, uh). Never paraphrase, fix grammar or join two places. A script checks every line against the transcript and throws away any idea whose line is not there.",
        "3. The hook text claims nothing that the line or the client file does not say. No made-up numbers, names or facts.",
        "4. It opens a question that the video answers. The line is where it is answered.",
        "5. Speak to the viewer's own life or curiosity. No brand slogans. Not the client's name, a logo, the speaker's name or title, or a club, chapter or country name.",
        "6. Not the current hook and nothing from ALREADY SUGGESTED.",
        RF_RULES_COMMON,
        "OUTPUT: JSON only, nothing else: {\"options\":[{\"text\":\"...\",\"line\":\"...\",\"why\":\"one short plain sentence\"}]}",
        "","=== CURRENT HOOK ===",cur||"(none)","","=== ALREADY SUGGESTED ===",seen[k].join("\n")||"(none)",
        "","=== PLAN ===",planText(it,rows),"","=== CLIENT FILE ("+cl.name+") ===",String(cl.pack||"").slice(0,16000),"","=== TRANSCRIPT ===",String(it.transcript||"").slice(0,32000)].join("\n");
    } else {
      var v=sw.bite||r.voice||{}, secs=tcSecs(r.tc)||8, others=bitesInCut(i);
      input=["You pick interview bites for a Happy Productions video editor.",
        "TASK: give 4 DIFFERENT bites for ONE beat of this video. Each one could replace the current bite.",
        "BEAT: "+r.tc+" "+(r.beat||"")+". Picture: "+plain(r.visual).slice(0,300),
        "LENGTH: about "+Math.round(secs)+" seconds of speech (about "+Math.max(8,Math.round(secs*2.6))+" words). A bit shorter or longer is fine.",
        "HARD RULES:",
        "1. Every \"quote\" is copied EXACTLY word for word from the TRANSCRIPT: one continuous passage, same words in the same order. You may drop only filler sounds (um, uh). Never paraphrase, fix grammar, join two places or translate. A script checks every quote against the transcript and throws away any that do not match.",
        "2. Not the current bite, not any bite already in the cut, nothing from ALREADY SUGGESTED. Each option must say something new.",
        "3. It must do this beat's job in the plan and flow from the beat before into the beat after.",
        "4. Prefer a specific, personal story line over a general line anyone could say (\"it's like a family\"). No \"how I joined / who invited me\" line as the main point.",
        "5. \"who\" = the speaker as the transcript names them. If the transcript does not say, write \"check by voice\". \"file\" = the source file name as the transcript writes it.",
        RF_RULES_COMMON,
        "OUTPUT: JSON only, nothing else: {\"options\":[{\"quote\":\"...\",\"who\":\"...\",\"file\":\"...\",\"why\":\"one short plain sentence: what this bite does here\"}]}",
        "","=== CURRENT BITE ===",(v.who?v.who+": ":"")+"\""+(v.quote||"")+"\"","","=== BITES ALREADY IN THE CUT ===",others.map(function(q){return "\""+q+"\"";}).join("\n")||"(none)",
        "","=== ALREADY SUGGESTED ===",seen[k].join("\n")||"(none)",
        "","=== PLAN ===",planText(it,rows),"","=== CLIENT FILE ("+cl.name+") ===",String(cl.pack||"").slice(0,16000),"","=== TRANSCRIPT ===",String(it.transcript||"").slice(0,32000)].join("\n");
    }
    try{
      var res=await sample(input,{signal:ctl[i].signal,cache:false,modelTier:"default"});
      var data=parseJSON(res.text), opts=(data&&data.options)||[], good=[], dropped=0;
      var cutRanges=kind==="bite"?rangesOf(bitesInCut(i).concat([(sw.bite||r.voice||{}).quote||""])):[];
      opts.forEach(function(o){
        if(!o) return;
        var txt=String(kind==="hook"?o.line:o.quote||"").trim();
        var hit=locate(ix,txt);
        if(!hit || (kind==="bite" && overlaps(hit,cutRanges)) || good.some(function(g){return overlaps(hit,[g.hit]);}) && kind==="bite"){ dropped++; return; }
        if(kind==="hook"){ var ht=String(o.text||"").trim(); if(!ht||ht.split(/\s+/).length>12){dropped++;return;} seen[k].push(ht); good.push({hit:hit,text:ht,line:txt,why:String(o.why||""),src:srcFor(ix,hit,null)}); }
        else { seen[k].push(txt); good.push({hit:hit,quote:txt,who:String(o.who||"check by voice"),why:String(o.why||""),src:srcFor(ix,hit,o.file)}); }
      });
      good=good.slice(0,kind==="hook"?4:3);
      P.list.innerHTML=good.map(function(g,n){
        return kind==="hook"
          ? '<div class="rf-opt"><span class="hk">'+esc(g.text)+'</span><span class="note">Pays off on: <q>“'+esc(g.line)+'”</q></span><span class="src">'+esc(g.src)+'</span><span class="why">'+esc(g.why)+'</span><button type="button" class="btn" data-use="'+n+'">Use this hook</button></div>'
          : '<div class="rf-opt"><span class="who">'+esc(g.who)+'</span><q>“'+esc(g.quote)+'”</q><span class="src">'+esc(g.src)+'</span><span class="why">'+esc(g.why)+'</span><button type="button" class="btn" data-use="'+n+'">Use this bite</button></div>';
      }).join("")||'<p class="note">No new '+(kind==="hook"?"hooks":"bites")+' that pass the check this time. Hit More to try again.</p>';
      P.status.textContent=(res.truncated?"The answer was cut short. ":"")+(dropped?dropped+" idea"+(dropped>1?"s were":" was")+" dropped: not word for word in the transcript, or already in the cut.":"");
      P.list.querySelectorAll("[data-use]").forEach(function(b){ b.addEventListener("click",function(){
        var g=good[+b.getAttribute("data-use")], cur=swaps[i]||{};
        if(kind==="hook") cur.hook={text:g.text,line:g.line,src:g.src,at:Date.now()};
        else cur.bite={who:g.who,quote:g.quote,src:g.src,at:Date.now()};
        swaps[i]=cur; commit(); paintRow(i); $("rf-"+i).hidden=true;
        okEmit(kind==="hook"?{kind:"Hook swapped",row:i,tc:r.tc||"",quote:g.text,note:"Pays off on: "+g.line,source:g.src}:{kind:"Bite swapped",row:i,tc:r.tc||"",quote:g.quote,source:g.src});
      }); });
      var db=await getDb(); if(db){ try{ await db.collection("refreshes").add({item:it.id,row:i,kind:kind,shown:good.map(function(g){return kind==="hook"?g.text:g.quote;}),dropped:dropped,at:Date.now()}); }catch(e){} }
    }catch(e){
      if(e&&e.code==="cancelled") return;
      var code=(e&&e.code)||(e&&e.name)||"unknown";
      if(/not_granted|denied|consent|permission/i.test(code)) permOff(P,i,kind);
      else P.status.textContent=(code==="bad_json")?"Claude's answer did not come back in the right shape. Hit More.":copyFor(code)+" ("+code+")";
      try{ console.warn("[blueprint-refresh]",code,e&&e.message); }catch(x){}
    }finally{ P.more.disabled=false; }
  }

  document.getElementById("blueprint").addEventListener("click",function(e){
    var b=e.target.closest&&e.target.closest("[data-rf],[data-more],[data-close],[data-undo],[data-perm]"); if(!b) return;
    var i=+b.getAttribute("data-row");
    if(b.hasAttribute("data-rf")){ stp[b.getAttribute("data-rf")+":"+i]=null; return run(i,b.getAttribute("data-rf")); }
    if(b.hasAttribute("data-more")) return run(i,b.getAttribute("data-more"));
    if(b.hasAttribute("data-perm")){ var kp=b.getAttribute("data-perm"), st2=b.closest(".rf-status"); cap("permissions").then(function(pm){ if(!pm) throw 0; return pm.manage().then(function(){ return pm.state("sample"); }); }).then(function(s){ if(s==="granted") run(i,kp); else if(st2) st2.textContent="Still off. Open the menu at the top of this page, go to Permissions, and switch on \u201cUse Claude\u201d."; }).catch(function(){ if(st2) st2.textContent="Open the menu at the top of this page, go to Permissions, and switch on \u201cUse Claude\u201d. You only do this once."; }); return; }
    if(b.hasAttribute("data-close")){ var c=+b.getAttribute("data-close"); if(ctl[c]) ctl[c].abort(); $("rf-"+c).hidden=true; return; }
    if(b.hasAttribute("data-undo")){ var kd=b.getAttribute("data-undo"); if(swaps[i]){ delete swaps[i][kd]; if(!swaps[i].hook&&!swaps[i].bite) delete swaps[i]; } commit(); paintRow(i); okEmit({kind:"Undo",row:i,tc:(rows[i]||{}).tc||"",note:"Undid the "+kd+" swap"}); }
  });
}

window.addEventListener("hashchange",function(){ if(unsub){unsub();unsub=null;} if(unsubSw){unsubSw();unsubSw=null;} load(); });
load();
})();
</script>
